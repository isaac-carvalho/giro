# ==============================================================================
# CONFIGURAÇÃO NGINX — GIRO ANGOLA (HTTP/2, WEBSOCKET UPGRADE, GZIP & RATE LIMIT)
# ==============================================================================

# Rate Limiting por IP
limit_req_zone $binary_remote_addr zone=giro_api_limit:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=giro_conn_limit:10m;

upstream giro_backend_nodes {
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.giro.ao giro.ao www.giro.ao;

    # Redirecionamento automático para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.giro.ao giro.ao;

    # Certificados SSL (Configurados pelo Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.giro.ao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.giro.ao/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;

    # Segurança HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # Otimização de Compressão GZIP para conexões móveis lentas (2G/3G)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Proxy para API REST
    location /api/ {
        limit_req zone=giro_api_limit burst=30 nodelay;
        limit_conn giro_conn_limit 20;

        proxy_pass http://giro_backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Proxy para WebSocket (Socket.io)
    location /socket.io/ {
        proxy_pass http://giro_backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health Check Endpoint
    location /health {
        proxy_pass http://giro_backend_nodes/health;
        access_log off;
    }
}
