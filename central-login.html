<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GIRO Central 24h — Autenticação de Operador Táctico</title>
  <meta name="theme-color" content="#070907">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">

  <style>
    :root {
      --bg: #070907;
      --card-bg: #0e130f;
      --card-inner: #151c16;
      --gold: #d4af37;
      --gold-grad: linear-gradient(135deg, #d4af37, #f0c040);
      --green: #22c55e;
      --red: #ef4444;
      --border: rgba(212, 175, 55, 0.22);
      --text: #f1f5f1;
      --muted: #8d9e8d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient radar grid background */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at center, rgba(212, 175, 55, 0.08) 0%, transparent 65%),
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
      z-index: 0;
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 32px 26px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.85);
      position: relative;
      z-index: 1;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .login-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .shield-icon {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.12);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 26px;
      box-shadow: 0 0 24px rgba(212, 175, 55, 0.25);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .brand-title span {
      color: var(--gold);
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      margin-top: 12px;
    }
    .security-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      background: var(--card-inner);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      padding: 14px 16px;
      outline: none;
      transition: all 0.2s ease;
      -webkit-appearance: none;
    }

    .form-control:focus {
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.2);
    }

    .pw-wrap {
      position: relative;
    }

    .pw-wrap .form-control {
      padding-right: 48px;
    }

    .pw-eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      background: var(--gold-grad);
      color: #000;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.35);
      margin-top: 8px;
    }

    .btn-submit:active {
      transform: scale(0.98);
      opacity: 0.85;
    }

    .alert-box {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 18px;
      display: none;
    }
    .alert-box.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }
    .alert-box.success {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #86efac;
    }

    .notice-box {
      margin-top: 24px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(255,255,255,0.1);
      text-align: center;
    }
    .notice-box p {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.6;
    }
    .notice-box strong {
      color: #fff;
    }

    .footer-links {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #556257;
    }
    .footer-links a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="shield-icon">🛡️</div>
      <div class="brand-title">GIRO <span>CENTRAL 24H</span></div>
      <div class="brand-sub">Posto de Comando & Telemetria</div>
      <div class="security-badge">
        <span class="dot"></span> Canal Criptografado SSL
      </div>
    </div>

    <div id="login-alert" class="alert-box"></div>

    <form id="operator-login-form" onsubmit="handleOperatorLogin(event)">
      <div class="form-group">
        <label class="form-label" for="op-username">Utilizador / E-mail do Operador</label>
        <input 
          type="text" 
          id="op-username" 
          class="form-control" 
          placeholder="Ex: operador1 ou nome@giro.ao" 
          required 
          autocomplete="username"
          autocapitalize="none"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="op-password">Senha de Segurança</label>
        <div class="pw-wrap">
          <input 
            type="password" 
            id="op-password" 
            class="form-control" 
            placeholder="••••••••••••" 
            required 
            autocomplete="current-password"
          >
          <button type="button" class="pw-eye-btn" onclick="togglePw()" aria-label="Mostrar senha">👁</button>
        </div>
      </div>

      <button type="submit" id="btn-login-submit" class="btn-submit">
        <span>Aceder à Central Táctica</span> →
      </button>
    </form>

    <div class="notice-box">
      <p>
        🔒 <strong>Acesso Restrito:</strong> Não há auto-cadastro nesta página. Credenciais emitidas pelo Administrador no Painel Master.
      </p>
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button type="button" onclick="quickFill('isaac','181818')" style="background:rgba(212,175,55,0.15);border:1px solid rgba(212,175,55,0.4);color:var(--gold);padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;">🔑 Testar como Dono (isaac / 181818)</button>
        <button type="button" onclick="quickFill('operador1','giro2026central')" style="background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);color:var(--green);padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;">👤 Testar como Operador</button>
      </div>
    </div>

    <div class="footer-links">
      <p>Em caso de perda de credenciais, contacte o seu supervisor directo.</p>
      <p style="margin-top:6px;">
        <a href="./index.html">← Voltar para Aplicação Passageiro</a>
      </p>
    </div>
  </div>

  <script>
    const CENTRAL_SESSION_KEY = 'giro_central_session';
    const CENTRAL_OPERATORS_KEY = 'giro_central_operators';

    // Seed default operator if empty
    function ensureInitialOperators() {
      let ops = [];
      try {
        ops = JSON.parse(localStorage.getItem(CENTRAL_OPERATORS_KEY) || '[]');
      } catch (e) { ops = []; }

      if (!ops || ops.length === 0) {
        ops = [
          {
            id: 'op-admin-isaac',
            nome: 'Isaac Carvalho (Administrador)',
            username: 'isaac',
            phone: '+244 923 000 000',
            password: '181818',
            role: 'Administrador Geral',
            status: 'ativo',
            createdAt: new Date().toISOString()
          },
          {
            id: 'op-default-1',
            nome: 'Operador Padrão (Central 24h)',
            username: 'operador1',
            phone: '+244 923 000 001',
            password: 'giro2026central',
            role: 'Operador Radar 24h',
            status: 'ativo',
            createdAt: new Date().toISOString()
          },
          {
            id: 'op-default-2',
            nome: 'Supervisor Táctico SOS',
            username: 'supervisor',
            phone: '+244 923 000 002',
            password: 'giro2026supervisor',
            role: 'Supervisor SOS & PNA',
            status: 'ativo',
            createdAt: new Date().toISOString()
          }
        ];
        localStorage.setItem(CENTRAL_OPERATORS_KEY, JSON.stringify(ops));
      } else {
        // Ensure isaac / 181818 is always present
        if (!ops.some(o => o.username.toLowerCase() === 'isaac')) {
          ops.unshift({
            id: 'op-admin-isaac',
            nome: 'Isaac Carvalho (Administrador)',
            username: 'isaac',
            phone: '+244 923 000 000',
            password: '181818',
            role: 'Administrador Geral',
            status: 'ativo',
            createdAt: new Date().toISOString()
          });
          localStorage.setItem(CENTRAL_OPERATORS_KEY, JSON.stringify(ops));
        }
      }
    }
    ensureInitialOperators();

    // Check if already authenticated
    (function checkAlreadyLoggedIn() {
      try {
        const s = JSON.parse(sessionStorage.getItem(CENTRAL_SESSION_KEY) || 'null');
        if (s && s.token && s.status === 'ativo') {
          window.location.replace('./central.html');
        }
      } catch (e) {}
    })();

    function togglePw() {
      const el = document.getElementById('op-password');
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    function quickFill(u, p) {
      document.getElementById('op-username').value = u;
      document.getElementById('op-password').value = p;
      showAlert('Credenciais preenchidas. Clique em "Aceder à Central Táctica"!', 'success');
    }

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('login-alert');
      box.className = 'alert-box ' + type;
      box.textContent = msg;
      box.style.display = 'block';
    }

    function handleOperatorLogin(e) {
      e.preventDefault();
      const userVal = document.getElementById('op-username').value.trim().toLowerCase();
      const passVal = document.getElementById('op-password').value;
      const btn = document.getElementById('btn-login-submit');

      btn.disabled = true;
      btn.innerHTML = '<span>A validar credenciais…</span> ⌛';

      setTimeout(() => {
        let ops = [];
        try {
          ops = JSON.parse(localStorage.getItem(CENTRAL_OPERATORS_KEY) || '[]');
        } catch (err) { ops = []; }

        const found = ops.find(o => 
          (o.username.toLowerCase() === userVal || (o.phone && o.phone.replace(/\s/g,'') === userVal.replace(/\s/g,''))) &&
          o.password === passVal
        );

        if (!found) {
          btn.disabled = false;
          btn.innerHTML = '<span>Aceder à Central Táctica</span> →';
          showAlert('Credenciais inválidas. Verifique o utilizador e a senha atribuídos pela Administração.');
          return;
        }

        if (found.status === 'bloqueado') {
          btn.disabled = false;
          btn.innerHTML = '<span>Aceder à Central Táctica</span> →';
          showAlert('Acesso suspenso. A sua conta de operador foi bloqueada pela Administração Geral.');
          return;
        }

        // Login successful
        showAlert('Autenticado com sucesso! A iniciar Posto de Comando...', 'success');
        
        const sessionPayload = {
          id: found.id,
          nome: found.nome,
          username: found.username,
          role: found.role,
          token: 'tok_' + Math.random().toString(36).substr(2) + Date.now(),
          loginTime: new Date().toISOString()
        };

        sessionStorage.setItem(CENTRAL_SESSION_KEY, JSON.stringify(sessionPayload));

        // Update operator last login in localStorage
        found.lastLogin = new Date().toISOString();
        localStorage.setItem(CENTRAL_OPERATORS_KEY, JSON.stringify(ops));

        setTimeout(() => {
          window.location.replace('./central.html');
        }, 700);
      }, 600);
    }
  </script>
</body>
</html>
